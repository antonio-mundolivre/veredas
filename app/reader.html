<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veredas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7a5c2e">
<link rel="apple-touch-icon" href="icons/app-180.png">
<link rel="manifest" href="manifest.webmanifest">

  <meta charset="UTF-8">
  <title>Veredas</title>
  <link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="web.css">
</head>
<body data-mode="lines">
  <div class="toolbar">
    <span class="brand"><img class="logo" src="icons/icon16.png" alt="">Veredas</span>
    <div class="group nav"><button class="active" disabled>Plano</button><button id="goCulto">Passagens</button></div>
    <div class="group">
      <button id="sizeDown" title="Diminuir letra">A−</button>
      <button id="sizeUp" title="Aumentar letra">A+</button>
    </div>
    <div class="group">
      <button data-theme-btn="light">Claro</button>
      <button data-theme-btn="sepia">Sépia</button>
      <button data-theme-btn="dark">Escuro</button>
    </div>
    <label>Versão
      <select id="version"></select>
    </label>
    <div class="group align" id="alignGroup"></div>
    <label>Largura
      <select id="width">
        <option value="26">Estreita</option>
        <option value="32">Média</option>
        <option value="40">Larga</option>
      </select>
    </label>
    <label>Layout
      <select id="mode">
        <option value="lines">Um versículo por linha</option>
        <option value="flow">Texto corrido</option>
      </select>
    </label>
  </div>

  <div id="pager"><main id="content"></main></div>

  <div class="pagebar">
    <button id="prev">‹ Anterior</button>
    <div class="mid"><div id="pageinfo"></div><div id="credit" class="credit"></div></div>
    <button id="next">Próxima ›</button>
  </div>

  <script src="web-shim.js"></script>
  <script src="bible-data.js"></script>
  <script src="state.js"></script>
  <script src="source.js"></script>
  <script src="pager.js"></script>
  <script src="selah.js"></script>
  <script src="reader.js"></script>
</body>
</html>
