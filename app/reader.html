<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veredas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7a5c2e">
<link rel="apple-touch-icon" href="icons/app-180.png">
<link rel="manifest" href="manifest.webmanifest">

  <meta charset="UTF-8">
  <title>Veredas</title>
  <link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="web.css">
</head>
<body data-mode="lines">
  <div class="toolbar">
    <span class="brand"><img class="logo" src="icons/icon16.png" alt="">Veredas</span>
    <div class="group nav"><button class="active" disabled data-i18n="common.nav.plan">Plano</button><button id="goCulto" data-i18n="common.nav.passages">Passagens</button></div>
    <div class="group">
      <button id="sizeDown" title="Diminuir letra" data-i18n-title="common.size.down">A−</button>
      <button id="sizeUp" title="Aumentar letra" data-i18n-title="common.size.up">A+</button>
    </div>
    <div class="group">
      <button data-theme-btn="light" data-i18n="common.theme.light">Claro</button>
      <button data-theme-btn="sepia" data-i18n="common.theme.sepia">Sépia</button>
      <button data-theme-btn="dark" data-i18n="common.theme.dark">Escuro</button>
    </div>
    <label><span data-i18n="common.version">Versão</span>
      <select id="version"></select>
    </label>
    <div class="group align" id="alignGroup"></div>
    <label><span data-i18n="common.width">Largura</span>
      <select id="width">
        <option value="26" data-i18n="common.width.narrow">Estreita</option>
        <option value="32" data-i18n="common.width.medium">Média</option>
        <option value="40" data-i18n="common.width.wide">Larga</option>
      </select>
    </label>
    <label><span data-i18n="common.layout">Layout</span>
      <select id="mode">
        <option value="lines" data-i18n="common.layout.lines">Um versículo por linha</option>
        <option value="flow" data-i18n="common.layout.flow">Texto corrido</option>
      </select>
    </label>
  </div>

  <div id="pager"><main id="content"></main></div>

  <div class="narrbar" id="narrbar" hidden>
    <button id="narrPrev" type="button"></button><button id="narrStop" type="button"></button><button id="narrNext" type="button"></button>
    <span id="narrInfo" class="narrinfo"></span>
    <select id="narrRate"><option value="0.7">0,7×</option><option value="0.85">0,85×</option><option value="1">1×</option><option value="1.15">1,15×</option><option value="1.3">1,3×</option><option value="1.5">1,5×</option></select>
  </div>

  <div class="pagebar">
    <button id="prev" data-i18n="common.prev">‹ Anterior</button>
    <button id="narrBtn" class="narrbtn" type="button" hidden></button>
    <div class="mid"><div id="pageinfo"></div><div id="credit" class="credit"></div></div>
    <button id="next" data-i18n="common.next">Próxima ›</button>
  </div>

  <script src="web-shim.js"></script>
  <script src="bible-data.js"></script>
  <script src="lang/books.js"></script>
  <script src="i18n.js"></script>
  <script src="lang/pt.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/es.js"></script>
  <script src="lang/fr.js"></script>
  <script src="lang/de.js"></script>
  <script src="state.js"></script>
  <script src="source.js"></script>
  <script src="pager.js"></script>
  <script src="selah.js"></script>
  <script src="wake.js"></script>
  <script src="narrator.js"></script>
  <script src="reader.js"></script>
</body>
</html>
