<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veredas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7a5c2e">
<link rel="apple-touch-icon" sizes="180x180" href="icons/app-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">

  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
<title>Veredas</title>
<link rel="stylesheet" href="web.css">
</head>
<body class="home-page">
  <div class="head">
    <h1><img class="logo" src="icons/icon96.png" alt="">Veredas</h1>
    <div class="headbtns">
      <button id="openHelp" class="icon" title="Ajuda" aria-label="Ajuda" data-i18n-title="popup.helpTip" data-i18n-aria-label="popup.helpTip"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.4a2.7 2.7 0 0 1 5.2 1c0 1.8-2.6 2.3-2.6 3.9"/><path d="M12 17.4h.01"/></svg></button>
      <button id="openOptions" class="icon" title="Configurar plano de leitura" data-i18n-title="popup.optionsTip">⚙</button>
    </div>
  </div>

  <div class="toprow">
    <button id="openToday" class="primary" hidden><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.8C10.3 5.3 7.8 4.6 3.5 4.6v12.9c4.3 0 6.8.7 8.5 2.2 1.7-1.5 4.2-2.2 8.5-2.2V4.6c-4.3 0-6.8.7-8.5 2.2z"/><path d="M12 6.8v12.9"/></svg><span data-i18n="popup.openToday">Leitura de hoje</span></button>
    <button id="openCulto"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8v3.6M10.3 4.5h3.4"/><path d="M12 6.6 6 10.4V20h12v-9.6z"/><path d="M10 20v-3.6a2 2 0 0 1 4 0V20"/><path d="M2.8 20h18.4"/></svg><span data-i18n="popup.passages">Passagens</span></button>
  </div>

  <section id="empty" class="card" hidden>
    <p data-i18n="popup.noPlan">Você ainda não tem um plano de leitura.</p>
    <button id="startSetup" class="primary wide" data-i18n="popup.choosePlan">Escolher meu plano</button>
  </section>

  <div id="cards"></div>

  <label class="ver"><span data-i18n="popup.bibleVersion">Versão da Bíblia</span>
    <select id="version"></select>
  </label>

  <script src="web-shim.js"></script>
  <script src="bible-data.js"></script>
  <script src="lang/books.js"></script>
  <script src="i18n.js"></script>
  <script src="lang/pt.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/es.js"></script>
  <script src="lang/fr.js"></script>
  <script src="lang/de.js"></script>
  <script src="state.js"></script>
  <script src="popup.js"></script>
</body>
</html>
